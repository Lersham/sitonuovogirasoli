name: Deploy anteprima su GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# true: un run rimasto bloccato in coda (es. un dispatch manuale mai
# raccolto da un runner) blocca ogni run successivo nello stesso gruppo,
# anche a distanza di molti minuti — è quello che è successo qui. Un push
# nuovo deve poter cancellare quello vecchio invece di restare in attesa
# all'infinito dietro di lui.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # GH_PAGES=true attiva il sottopercorso /sitonuovogirasoli/ solo per
      # questa build di anteprima. Il deploy reale su gira-soli.it non usa
      # questa variabile: nessun codice da smontare, solo un flag da non
      # passare.
      - name: Build (anteprima GitHub Pages)
        run: GH_PAGES=true npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
